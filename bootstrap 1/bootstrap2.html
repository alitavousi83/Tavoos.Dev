<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Bootstrap Card</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        /* =====================================================
           BACKGROUND
        ====================================================== */

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(99, 102, 241, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(168, 85, 247, 0.20),
                    transparent 35%
                ),
                #080b14;

            font-family: system-ui, sans-serif;
            color: white;
        }


        /* =====================================================
           SCREEN RECORD #1
           CARD CONTAINER
        ====================================================== */

        .premium-card {
            width: 380px;

            background: rgba(255, 255, 255, 0.06);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                0 0 60px rgba(99, 102, 241, 0.12);

            overflow: hidden;

            transition: 0.3s ease;
        }

        .premium-card:hover {
            transform: translateY(-8px);

            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.55),
                0 0 80px rgba(99, 102, 241, 0.2);
        }


        /* =====================================================
           SCREEN RECORD #2
           CARD IMAGE / ICON AREA
        ====================================================== */

        .card-visual {
            height: 220px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6,
                    #d946ef
                );

            position: relative;
        }

        .card-visual::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.12);

            filter: blur(5px);
        }

        .visual-icon {
            position: relative;
            z-index: 2;

            width: 95px;
            height: 95px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            background: rgba(255, 255, 255, 0.15);

            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(10px);

            font-size: 42px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2);
        }


        /* =====================================================
           SCREEN RECORD #3
           CARD CONTENT
        ====================================================== */

        .card-content {
            padding: 30px;
        }

        .badge-custom {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 50px;

            background: rgba(99, 102, 241, 0.15);

            color: #a5b4fc;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.5px;
            
        }

        .card-title {
            font-size: 28px;

            font-weight: 700;

            margin-top: 15px;

            margin-bottom: 10px;

            color: wheat;
        }

        .card-description {
            color: #94a3b8;

            line-height: 1.7;

            font-size: 14px;
        }


        /* =====================================================
           SCREEN RECORD #4
           PRICE
        ====================================================== */

        .price {
            font-size: 32px;

            font-weight: 700;

            margin: 22px 0;

            color: white;
        }

        .price span {
            font-size: 14px;

            font-weight: 400;

            color: #64748b;
        }


        /* =====================================================
           SCREEN RECORD #5
           BUTTONS
        ====================================================== */

        .btn-premium {
            border: none;

            border-radius: 12px;

            padding: 12px 20px;

            font-weight: 600;

            transition: 0.2s;
        }

        .btn-main {
            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            color: white;
        }

        .btn-main:hover {
            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(99, 102, 241, 0.35);
        }

        .btn-outline-custom {
            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.1);

            color: #cbd5e1;
        }

        .btn-outline-custom:hover {
            background: rgba(255, 255, 255, 0.1);

            color: white;
        }
    </style>
</head>


<body>


    <!-- =====================================================
         SCREEN RECORD #1
         BOOTSTRAP CARD STRUCTURE
    ====================================================== -->

    <div class="card premium-card border-0">

        <!-- =================================================
             SCREEN RECORD #2
             VISUAL SECTION
        ================================================== -->

        <div class="card-visual">

            <div class="visual-icon">
                ⚡
            </div>

        </div>


        <!-- =================================================
             SCREEN RECORD #3
             CARD BODY
        ================================================== -->

        <div class="card-body card-content">

            <span class="badge-custom">
                PREMIUM
            </span>

            <h2 class="card-title">
                Build Faster
            </h2>

            <p class="card-description">
                Create beautiful and responsive
                interfaces without unnecessary
                complexity.
            </p>


            <!-- =================================================
                 SCREEN RECORD #4
                 PRICE
            ================================================== -->

            <div class="price">
                $49
                <span>/ month</span>
            </div>


            <!-- =================================================
                 SCREEN RECORD #5
                 BUTTONS
            ================================================== -->

            <div class="d-flex gap-2">

                <button class="btn btn-premium btn-main flex-grow-1">
                    Get Started
                </button>

                <button class="btn btn-premium btn-outline-custom">
                    →
                </button>

            </div>

        </div>

    </div>


</body>
</html>
